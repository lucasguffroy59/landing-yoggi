<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Get Yoggi</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JP6QS5YX0E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JP6QS5YX0E');
  </script>

  <!-- Smart link : redirige au tap, sur le device du destinataire, vers le store adapté à SA
       plateforme (peu importe qui a envoyé le lien). Event dédié "share_redirect_store_click"
       pour distinguer ce trafic (partage d'image depuis l'app) du tracking landing habituel :
       pas de conversion Ads ici, ce n'est pas du trafic publicitaire. -->
  <script>
  (function () {
    var BACKEND_EVENTS_URL = "https://yoggi-backend.up.railway.app/api/analytics/events";
    var LANDING_ANALYTICS_TOKEN = "d9ed57ddfdcea52954c96539f32a6a3edf36b05ce35b140b";
    var APP_STORE_URL = "https://apps.apple.com/app/yoggi-safe-ai-kids-chat/id6785544354";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.yoggi.app";

    function getAnonymousId() {
      var key = "yoggi_anonymous_id";
      var id = localStorage.getItem(key);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(key, id);
      }
      return id;
    }

    function sendBackendEvent(eventName, properties) {
      try {
        fetch(BACKEND_EVENTS_URL, {
          method: "POST",
          keepalive: true,
          headers: {
            "Content-Type": "application/json",
            "X-App-Token": LANDING_ANALYTICS_TOKEN,
          },
          body: JSON.stringify({
            anonymousId: getAnonymousId(),
            eventName: eventName,
            properties: properties || {},
          }),
        }).catch(function () {});
      } catch (err) {}
    }

    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    if (isIOS) {
      sendBackendEvent("share_redirect_store_click", { platform: "ios" });
      if (typeof gtag === "function") gtag("event", "share_redirect_store_click", { platform: "ios" });
      window.location.replace(APP_STORE_URL);
    } else if (isAndroid) {
      sendBackendEvent("share_redirect_store_click", { platform: "android" });
      if (typeof gtag === "function") gtag("event", "share_redirect_store_click", { platform: "android" });
      window.location.replace(PLAY_STORE_URL);
    }
    // Sinon (desktop) : pas de store pertinent, on laisse la page de repli ci-dessous s'afficher.
  })();
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF8EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    .card img.logo { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 16px; }
    .card h1 { font-size: 22px; margin: 0 0 8px; color: #2B2B2B; }
    .card p { font-size: 15px; color: #6B6B6B; margin: 0 0 24px; }
    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .badges img { height: 48px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../icon.png" alt="Yoggi">
    <h1>Get Yoggi</h1>
    <p>The AI built for your child's age. Download the app to see what was shared with you.</p>
    <div class="badges">
      <a href="https://apps.apple.com/app/yoggi-safe-ai-kids-chat/id6785544354">
        <img src="../download-app-store-en.svg" alt="Download on the App Store">
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.yoggi.app">
        <img src="../get-google-play-english.png" alt="Get it on Google Play">
      </a>
    </div>
  </div>
</body>
</html>
